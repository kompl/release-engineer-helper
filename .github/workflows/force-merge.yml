# Кнопка force-merge в PR: метка `force-merge`.
#
# Механика — обход рулсета целиком. Приложение GitHub Actions внесено в
# `bypass_actors`, поэтому мёрж под `GITHUB_TOKEN` проходит независимо от
# вердикта сборки и наличия апрува. Требуется именно обход: перезаписью
# статуса закрывалось только одно условие из двух, и на PR без апрува кнопка
# упиралась в правило `pull_request`.
#
# Плата за это — обход получает не кнопка, а весь `GITHUB_TOKEN` репозитория:
# любой воркфлоу здесь способен влить в main мимо правил. Гранулярнее GitHub не
# умеет, bypass выдаётся актору, а не воркфлоу. Поэтому единственный барьер —
# право править `.github/workflows`, и поэтому же аудит ниже обязателен: следа
# в виде перекрытого статуса больше не остаётся.
#
# `pull_request_target` даёт токен на запись и берёт workflow из базовой ветки;
# код PR здесь не выкачивается и не исполняется.

name: Force merge

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  force-merge:
    name: force merge

    if: github.event.label.name == 'force-merge' && github.event.pull_request.state == 'open'

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.CI_STATUS_TOKEN || github.token }}
      REPO: ${{ github.event.repository.full_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ACTOR: ${{ github.event.sender.login }}
      RUN_URL: https://github.com/${{ github.event.repository.full_name }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check actor permission
        run: |
          permission=$(gh api "/repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          echo "${ACTOR} has ${permission} permission"
          case "${permission}" in
            admin|maintain|write) ;;
            *)
              echo "::error::${ACTOR} is not allowed to force-merge (permission: ${permission})"
              exit 1
              ;;
          esac

      # Единственный след того, что именно обошли: статус больше не
      # перезаписывается, так что вердикт фиксируется только здесь.
      - name: Record what is being bypassed
        run: |
          verdict=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/status" --jq '.state')
          review=$(gh pr view "${PR_NUMBER}" -R "${REPO}" --json reviewDecision --jq '.reviewDecision // "—"')
          checks=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | "\(.name): \(.status)/\(.conclusion // "—")"] | join("\n")')
          {
            echo "**Force merge** by @${ACTOR}"
            echo
            echo "Правила рулсета обойдены на head-коммите \`${HEAD_SHA}\`."
            echo "Вердикт сборки — \`${verdict}\`, ревью — \`${review}\`."
            echo
            echo '```'
            echo "${checks}"
            echo '```'
            echo
            echo "[Прогон, выполнивший обход](${RUN_URL})"
          } > comment.md
          gh pr comment "${PR_NUMBER}" -R "${REPO}" --body-file comment.md

      # GitHub изредка отвечает «Base branch was modified» на мутацию, которая
      # уже прошла: PR влит, а мёрж-запрос вернул ошибку из-за устаревшего кэша
      # мержабельности. Верим состоянию PR, а не коду возврата.
      - name: Merge pull request
        run: |
          if gh pr merge "${PR_NUMBER}" -R "${REPO}" --rebase; then
            exit 0
          fi

          state=$(gh pr view "${PR_NUMBER}" -R "${REPO}" --json state --jq '.state')

          if [ "${state}" = "MERGED" ]; then
            echo "Мёрж-запрос вернул ошибку, но PR уже влит — считаем шаг успешным"
            exit 0
          fi

          echo "::error::Merge failed, PR state: ${state}"
          exit 1
